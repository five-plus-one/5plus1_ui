<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>按钮组件测试</title>
  <link rel="stylesheet" href="src/lib/styles.css">
  <style>
    body { padding: 3rem; background: #f8fafc; }
    .section { margin-bottom: 3rem; background: white; padding: 2rem; border-radius: 12px; }
    h2 { margin: 0 0 1.5rem 0; font-size: 1.25rem; color: #1e293b; }
  </style>
</head>
<body>

<div class="section">
  <h2>按钮组件</h2>
  <div class="fp-row">
    <button class="fp-button fp-primary">主要按钮</button>
    <button class="fp-button fp-secondary">次要按钮</button>
    <button class="fp-button fp-ghost">幽灵按钮</button>
    <button class="fp-button fp-danger">危险按钮</button>
  </div>
  <br>
  <div class="fp-row">
    <button class="fp-button fp-primary fp-sm">小按钮</button>
    <button class="fp-button fp-primary">中按钮</button>
    <button class="fp-button fp-primary fp-lg">大按钮</button>
  </div>
</div>

</body>
</html>
